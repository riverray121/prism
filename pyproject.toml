[project]
name = "prism-sidecar"
version = "0.1.0"
description = "Prism analysis sidecar"
requires-python = ">=3.12,<3.13"
dependencies = [
    "audio-separator>=0.44.2",
    "librosa>=0.11.0",
    "mutagen>=1.47.0",
    "numpy>=2.4.6",
    "onnxruntime>=1.26.0",
    "panns-inference>=0.1.1",
    "pydantic>=2",
    "pyloudnorm>=0.2.0",
    "scipy>=1.17.1",
    "torch>=2.12.0",
    "yt-dlp>=2026.7.4",
]

[tool.uv]
package = false

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
# Repo root on sys.path so tests can `import sidecar`; suite lives in tests/.
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
# Vendored third-party code is kept close to upstream; don't lint or reformat it.
extend-exclude = ["sidecar/vendor"]
